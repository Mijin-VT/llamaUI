[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llamaui"
version = "0.1.0"
description = "Local llama-server model manager — run, configure, and route GGUF models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.scripts]
llamaui = "qt_app.main:main"

[project.gui-scripts]
llamaui-gui = "qt_app.main:main"

[tool.setuptools.packages.find]
include = ["qt_app*"]

[tool.setuptools.package-data]
qt_app = ["icons/*.png", "*.qss"]
